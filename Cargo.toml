[workspace]
resolver = "3"
members = ["crates/hfd-core", "crates/hfd-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.88"
repository = "https://github.com/TheSyrianDev/hf-dl"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
globset = "0.4"
futures-util = "0.3"
hex = "0.4"
hf-xet = "1.7.0"
indicatif = "0.18"
pathdiff = "0.2"
percent-encoding = "2.3"
reqwest = { version = "0.13", features = ["form", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
